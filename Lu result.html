             var message = '';

             function OnChangeCourseId() {
        debugger;
                var _CourseId = $("#CourseId").val();

                $("#Hdn_CourseName").val($("#CourseId option:selected").text());

                if (_CourseId != '' && _CourseId != 0) {

             $.ajax({
                 url: '/Results/EvenResult2024/BindSemesterCourseId',
                 data: { CourseId: _CourseId, ProcId: 2 },
                 datatype: "json",
                 type: 'GET',
                 async: false,
                 success: function (data) {
                     if (data != null) {
                         $("#Semester").empty();
                         $("#Semester").append('<option value="">--Select--</option>');
                         $.each(data, function (x, result) {
                             $("#Semester").append('<option value=' + result.Id + '>' + result.Value + '</option>');
                         });
                     }
                 },
                 error: function () {
                 }
             });

         }
         else {
                    $("#Semester").empty();
                    $("#Semester").append('<option value="">--Select--</option>');
         }
            }

            function OnChangeSemester() {
        debugger;
                var _CourseId = $("#CourseId").val();
                var _Semester = $("#Semester").val();

                if (_CourseId != '' && _CourseId != 0 && _Semester != '' && _Semester != 0 ) {

             $.ajax({
                 url: '/Results/EvenResult2024/BindExamCourseId',
                 data: { CourseId: _CourseId, Semester: _Semester, ProcId:3 },
                 datatype: "json",
                 type: 'GET',
                 async: false,
                 success: function (data) {
                     if (data != null) {
                         $("#ExamType").empty();
                         $("#ExamType").append('<option value="">--Select--</option>');
                         $.each(data, function (x, result) {
                             $("#ExamType").append('<option value=' + result.Id1 + '>' + result.Value1 + '</option>');
                         });
                     }
                 },
                 error: function () {
                 }
             });

         }
         else {
                    $("#ExamType").empty();
                    $("#ExamType").append('<option value="">--Select--</option>');
         }
            }

            function OnChangeExamType() {
        debugger;
                var _CourseId = $("#CourseId").val();
                var _Semester = $("#Semester").val();
                var _ExamType = $("#ExamType").val();
                if (_CourseId != '' && _CourseId != 0 && _Semester != '' && _Semester != 0 && _ExamType!=0 ) {

             $.ajax({
                 url: '/Results/EvenResult2024/BindSubjectCourseId',
                 data: { CourseId: _CourseId, Semester: _Semester, ProcId: 4, ExamType: _ExamType},
                 datatype: "json",
                 type: 'GET',
                 async: false,
                 success: function (data) {
                     if (data != null) {
                         $("#SubjectId").empty();
                         $("#SubjectId").append('<option value="">--Select--</option>');
                         $.each(data, function (x, result) {
                             $("#SubjectId").append('<option value=' + result.Id + '>' + result.Value + '</option>');
                         });
                     }
                 },
                 error: function () {
                 }
             });

         }
         else {
             $("#SubjectId").empty();
             $("#SubjectId").append('<option value="">--Select--</option>');
         }
            }

            function ValidateLogin() {
                debugger;
                if ($("#CourseId").val() == "") {
                    $("#CourseId").focus()
                    swal("Required !", "Please select your course.", "warning");
                    return false;
                }
                if ($("#Semester").val() == "") {
                    $("#Semester").focus()
                    swal("Required !", "Please select your Semester.", "warning");
                    return false;
                }
                if ($("#ExamType").val() == "") {
                    $("#ExamType").focus()
                    swal("Required !", "Please select your ExamType.", "warning");
                    return false;
                }
                if ($("#SubjectId").val() == "") {
                    $("#SubjectId").focus()
                    swal("Required !", "Please select your subject.", "warning");
                    return false;
                }

                if ($("#Rollno").val() == "") {
                    $("#Rollno").focus()
                    swal("Required !", "Please enter roll number.", "warning");
                    return false;
                        }

                if ($("#Dob").val() == "") {
                    $("#Dob").focus();
                    swal("Required !", "Please enter your date of birth.", "warning");
                    return false;
                }
                return true;

    }
