<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMHL Pro Master Search Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0fdf4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .search-bar { transition: all 0.3s ease; }
        .search-bar:focus-within { box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); transform: translateY(-2px); }
        .highlight { background-color: #fde047; color: #b45309; font-weight: bold; border-radius: 4px; padding: 0 4px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .dept-card { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- Header & Search Area -->
    <div class="sticky top-0 z-50 glass-header shadow-lg p-6 rounded-b-3xl">
        <div class="max-w-7xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                <div class="text-white text-center md:text-left">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wide drop-shadow-md">
                        <i class="fas fa-headset mr-3 text-blue-400"></i>CMHL Smart Finder Pro
                    </h1>
                    <p class="text-blue-200 text-sm mt-2 font-medium bg-white/10 inline-block px-4 py-1 rounded-full">
                        उत्तर प्रदेश CM Helpline (1076) - All Departments Database
                    </p>
                </div>
                <div class="bg-white/10 backdrop-blur-md text-white px-5 py-3 rounded-xl border border-white/20 text-sm font-bold shadow-inner flex gap-4">
                    <div class="text-center"><span id="totalDepts" class="block text-2xl text-blue-300">0</span>विभाग</div>
                    <div class="w-px bg-white/30"></div>
                    <div class="text-center"><span id="totalCategories" class="block text-2xl text-green-300">0</span>श्रेणियां</div>
                </div>
            </div>

            <!-- Search Input -->
            <div class="relative search-bar max-w-4xl mx-auto">
                <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                    <i class="fas fa-search text-gray-400 text-xl"></i>
                </div>
                <input type="text" id="searchInput" 
                    class="block w-full pl-14 pr-12 py-4 rounded-2xl border-0 ring-4 ring-white/20 focus:ring-blue-400 text-lg text-gray-900 shadow-xl placeholder-gray-500 font-medium transition-all" 
                    placeholder="सर्च करें (Hindi या English में) उदा: राशन, Light, FIR, Pension, सड़क..."
                    onkeyup="performSearch()">
                <button onclick="clearSearch()" id="clearBtn" class="absolute inset-y-0 right-0 pr-5 flex items-center hidden text-gray-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-times-circle text-2xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Results -->
    <div class="max-w-7xl mx-auto mt-8 px-4">
        <div id="noResults" class="hidden text-center py-16 bg-white rounded-3xl shadow-sm border border-gray-200">
            <i class="fas fa-search-minus text-7xl text-slate-300 mb-6"></i>

        </div>

        <!-- Dynamic Results Container -->
        <div id="resultsContainer" class="space-y-8">
            <!-- Results will be injected here via JavaScript -->
        </div>
    </div>

        // ==========================================
        // SYSTEM LOGIC (कोडिंग पार्ट)
        // ==========================================

        const resultsContainer = document.getElementById('resultsContainer');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');

        // Initialize counters
        function updateCounters() {
            document.getElementById('totalDepts').innerText = cmhlData.length;
            let catCount = 0;
            cmhlData.forEach(d => catCount += d.categories.length);
            document.getElementById('totalCategories').innerText = catCount;
        }

        // Highlight matching text
        function highlightText(text, query) {
            if (!query) return text;
            // Escape special characters in query to prevent regex errors
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            return text.replace(regex, `<span class="highlight">$1</span>`);
        }

        // Render Data Function
        function renderData(dataToRender, query = '') {
            resultsContainer.innerHTML = '';
            
            if (dataToRender.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            dataToRender.forEach(dept => {
                // If searching, auto-expand. If just loading, keep collapsed.
                const isExpanded = query.length > 0; 
                
                const deptHTML = `
                    <div class="dept-card rounded-2xl overflow-hidden shadow-md border ${dept.color} bg-white transition-all hover:shadow-lg">
                        <div class="px-6 py-5 cursor-pointer flex justify-between items-center bg-white/50 backdrop-blur-sm" onclick="toggleAccordion(this)">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-2xl shadow-sm border border-current">
                                    <i class="fas ${dept.icon}"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl sm:text-2xl font-black tracking-tight">${highlightText(dept.vibhag, query)}</h2>
                                    <p class="text-sm font-semibold opacity-75 mt-1">${dept.categories.length} Categories</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4 ml-4">
                                <i class="fas fa-chevron-down text-xl transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}"></i>
                            </div>
                        </div>
                        
                        <div class="accordion-content ${isExpanded ? 'block' : 'hidden'} bg-white divide-y divide-gray-100">
                            ${dept.categories.map(cat => `
                                <div class="p-6 sm:p-8 hover:bg-slate-50 transition-colors relative group">
                                    <div class="flex flex-col lg:flex-row gap-6 justify-between items-start">
                                        <div class="flex-1 w-full">
                                            <span class="inline-block px-3 py-1 bg-slate-800 text-white text-xs font-bold rounded-md mb-3 shadow-sm">${cat.shreni}</span>
                                            <h3 class="text-xl font-bold text-slate-800 mb-2 leading-snug">${highlightText(cat.title, query)}</h3>
                                            
                                            <!-- Keywords tags -->
                                            <div class="flex flex-wrap gap-2 mb-4">
                                                <i class="fas fa-tags text-slate-400 mt-1"></i>
                                                ${cat.keywords.map(kw => `
                                                    <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">
                                                        ${highlightText(kw, query)}
                                                    </span>
                                                `).join('')}
                                            </div>
                                        </div>
                                        
                                        <button onclick="copyFormat(this, \`${cat.format.replace(/\n/g, '\\n')}\`)" 
                                            class="shrink-0 w-full lg:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-sm font-bold py-3 px-6 rounded-xl shadow-md flex justify-center items-center gap-2 transition-all transform hover:scale-105 active:scale-95">
                                            <i class="fas fa-copy text-lg"></i> Format Copy
                                        </button>
                                    </div>
                                    
                                    <div class="mt-4 p-5 bg-slate-50 rounded-xl border border-slate-200 font-medium text-slate-700 text-[15px] shadow-inner relative">
                                        <div class="absolute top-0 left-0 w-1 h-full bg-blue-400 rounded-l-xl"></div>
                                        <pre class="font-sans whitespace-pre-wrap leading-relaxed">${highlightText(cat.format, query)}</pre>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                resultsContainer.insertAdjacentHTML('beforeend', deptHTML);
            });
        }

        // Toggle Accordion open/close
        function toggleAccordion(element) {
            const content = element.nextElementSibling;
            const icon = element.querySelector('.fa-chevron-down');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // Search Engine Function
        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            
            // Toggle clear button visibility
            if(query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            if (query === '') {
                renderData(cmhlData);
                return;
            }

            // Filtering logic
            const filteredData = cmhlData.map(dept => {
                // Check if department name matches
                const deptMatch = dept.vibhag.toLowerCase().includes(query);
                
                // Filter categories within the department
                const matchedCategories = dept.categories.filter(cat => {
                    const titleMatch = cat.title.toLowerCase().includes(query);
                    const formatMatch = cat.format.toLowerCase().includes(query);
                    const keywordMatch = cat.keywords.some(kw => kw.toLowerCase().includes(query));
                    return titleMatch || formatMatch || keywordMatch;
                });

                // If department matches, show all its categories. Else, show only matched categories.
                if (deptMatch && matchedCategories.length === 0) {
                     return { ...dept, categories: dept.categories };
                } else if (matchedCategories.length > 0) {
                     return { ...dept, categories: matchedCategories };
                }
                return null;
            }).filter(item => item !== null);

            renderData(filteredData, query);
        }

        // Clear Search Input
        function clearSearch() {
            searchInput.value = '';
            performSearch();
            searchInput.focus();
        }

        // Copy Format to Clipboard
        function copyFormat(btnElement, textToCopy) {
            // Replace literal \n with actual newlines for clipboard
            const formattedText = textToCopy.replace(/\\n/g, '\n');
            
            navigator.clipboard.writeText(formattedText).then(() => {
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="fas fa-check-circle text-lg"></i> Copied!';
                btnElement.classList.replace('from-blue-600', 'from-emerald-500');
                btnElement.classList.replace('to-indigo-600', 'to-emerald-600');
                btnElement.classList.replace('hover:from-blue-700', 'hover:from-emerald-600');
                btnElement.classList.replace('hover:to-indigo-700', 'hover:to-emerald-700');
                
                setTimeout(() => {
                    btnElement.innerHTML = originalHTML;
                    btnElement.classList.replace('from-emerald-500', 'from-blue-600');
                    btnElement.classList.replace('to-emerald-600', 'to-indigo-600');
                    btnElement.classList.replace('hover:from-emerald-600', 'hover:from-blue-700');
                    btnElement.classList.replace('hover:to-emerald-700', 'hover:to-indigo-700');
                }, 2000);
            }).catch(err => {
                alert('Copy करने में त्रुटि आई: ' + err);
            });
        }

        // Initialize on page load
        window.onload = () => {
            updateCounters();
            renderData(cmhlData);
        };

    </script>
